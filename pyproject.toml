[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epoch-echo"
version = "0.1.0"
description = "Video pipeline for the Epoch & Echo YouTube channel: turns raw footage into an upload-ready video, thumbnail, and metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Epoch & Echo" }]
dependencies = [
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
epoch-echo = "epoch_echo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epoch_echo = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
