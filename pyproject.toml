[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gi-radio"
version = "0.1.0"
description = "Typed ElevenLabs + ComfyUI + FFmpeg pipeline for 'The Voice in the Hooch'"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gi-radio = "gi_radio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
